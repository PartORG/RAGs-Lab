# Uploaded documents stay on this machine: listen on localhost only and send no usage stats.
# Read from the working directory, which is why main.py switches to the project root first.

[browser]
gatherUsageStats = false
# Otherwise Streamlit looks up the machine's public IP over the network at startup.
serverAddress = "localhost"

[server]
address = "localhost"
headless = true
maxUploadSize = 50
